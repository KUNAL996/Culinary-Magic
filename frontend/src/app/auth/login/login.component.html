<div class="auth-page">
  <div class="card auth-card">
    <div class="auth-header">
      <div class="icon">🍲</div>
      <h2>Welcome back</h2>
      <p class="text-muted">Log in to keep cooking with Culinary Magic.</p>
    </div>

    <div class="server-error" *ngIf="serverError">{{ serverError }}</div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />
        <span class="field-error" *ngIf="f['email'].touched && f['email'].errors?.['required']">
          Email is required.
        </span>
        <span class="field-error" *ngIf="f['email'].touched && f['email'].errors?.['email']">
          Please enter a valid email address.
        </span>
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" />
        <span class="field-error" *ngIf="f['password'].touched && f['password'].errors?.['required']">
          Password is required.
        </span>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting">
        {{ submitting ? 'Logging in...' : 'Log In' }}
      </button>
    </form>

    <p class="auth-footer-link">Don't have an account? <a routerLink="/register">Sign up</a></p>
  </div>
</div>
